[functions.zos-business-data]
# This endpoint only returns read-only business summaries to authenticated users.
verify_jwt = true

[functions.zos-brain-index]
# This endpoint accepts only user-authorized, metadata-only Obsidian indexes.
verify_jwt = true

[functions.zos-feishu-approval-preview]
# Generates a short-lived preview only; it never mutates Feishu.
verify_jwt = true

[functions.zos-feishu-approval-execute]
# Executes exactly one previously previewed approval and verifies readback.
verify_jwt = true

[functions.zos-monitor]
# Accepts sanitized operating events and stores them server-side for the authenticated owner.
verify_jwt = true

[functions.zos-intelligence-data]
# Reads private intelligence summaries; optional Feishu refresh uses server-only configured targets.
verify_jwt = true

[functions.zos-business-refresh]
# Internal cron-only endpoint. It performs read-only Feishu reads and requires x-zos-cron-secret.
verify_jwt = false
