name: Recover stuck Pages deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages-recovery.yml

permissions:
  contents: read
  pages: write

jobs:
  cancel-stuck-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          STALE_DEPLOYMENT: 7ff1aea3d833f5c1b8da5be4164af902a48b4ea3
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$({ curl -L -sS \
            -o "$response_file" \
            -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/pages/deployments/$STALE_DEPLOYMENT/cancel"; } || true)"

          if [[ "$status" != "204" && "$status" != "404" ]]; then
            cat "$response_file"
            echo "Unexpected cancel response: HTTP $status" >&2
            exit 1
          fi

          echo "Stale Pages deployment cleared (HTTP $status)."
