name: ZOS Workbench Healthcheck

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Check public PWA endpoints
        shell: bash
        run: |
          set -euo pipefail
          base='https://xz1220z-afk.github.io/zos-workbench'
          for path in / /manifest.webmanifest /sw.js; do
            status=$(curl -L -sS -o /tmp/zos-response -w '%{http_code}' "$base$path")
            test "$status" = 200
          done
          curl -L -fsS "$base/" | grep -F "const APP_VERSION = '1.4.1'"
          curl -L -fsS "$base/" | grep -F "requestOtp(email, PUBLIC_APP_URL)"
          curl -L -fsS "$base/sw.js" | grep -F "zos-workbench-v1.4.1"
